# =========================================================
# JW LS MAPAS VISIT - CONFIGURACAO DE PRODUCAO / iContainer
# =========================================================

# Servidor HTTP
server.port=${PORT:8080}
server.address=0.0.0.0

# PostgreSQL - no iContainer use:
DATABASE_URL=jdbc:postgresql://postgresql-17:5432/postgresql-jw-visit
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://postgresql-17:5432/postgresql-jw-visit}
spring.datasource.username=${DATABASE_USERNAME:postgresql-jw-visit}
spring.datasource.password=${DATABASE_PASSWORD:pwd_3kw7sR}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=${HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.temp.use_jdbc_metadata_defaults=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# JWT - obrigatorio definir JWT_SECRET no ambiente do container
app.jwt.secret=${JWT_SECRET:LS_MAPS_VISIT_JWT_SECRET_PRODUCAO_2026_9f83a72c4d61e580}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# JSON
spring.jackson.property-naming-strategy=SNAKE_CASE

# Recuperação de senha: configure SMTP e a URL pública do frontend.
app.password-reset.enabled=${PASSWORD_RESET_ENABLED:false}
app.password-reset.frontend-url=${FRONTEND_URL:http://localhost:5173}
app.password-reset.from=${MAIL_FROM:}
spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_STARTTLS:true}
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000

# Administrador inicial - defina ADMIN_PASSWORD no ambiente do container
app.bootstrap.admin-email=${ADMIN_EMAIL:admin@lsmapas.com}
app.bootstrap.admin-name=${ADMIN_NAME:Administrador}
app.bootstrap.admin-password=${ADMIN_PASSWORD:Admin@123}

# Uploads
app.upload-dir=${UPLOAD_DIR:uploads}
